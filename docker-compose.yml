services:
  build:
    image: ghcr.io/southclaws/sampctl:1.13.0
    platform: linux/amd64
    working_dir: /samp
    profiles: ["build"]
    volumes:
      - .:/samp
    entrypoint: ["sh", "-lc", "sampctl ensure && sampctl build"]

  run:
    image: ghcr.io/southclaws/sampctl:1.13.0
    platform: linux/amd64
    working_dir: /samp
    profiles: ["run"]
    volumes:
      - .:/samp
    entrypoint: ["sh", "-lc", "sampctl ensure && sampctl build && sampctl run --forceEnsure --forceBuild"]